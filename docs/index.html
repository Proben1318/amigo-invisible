<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amigo Invisible 🎁</title>
<meta name="robots" content="noindex">
<style>
  :root { --rojo:#c62633; --verde:#1a8c4e; --crema:#fff8ef; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 20% 10%, #2b6b47, #123524 70%);
    color:#222; padding:20px; overflow:hidden;
  }
  .card {
    position:relative; z-index:1; background:var(--crema); border-radius:22px;
    padding:34px 26px; width:100%; max-width:380px; text-align:center;
    box-shadow:0 18px 50px rgba(0,0,0,.35);
  }
  .card::before {
    content:""; position:absolute; inset:0 0 auto 0; height:10px; border-radius:22px 22px 0 0;
    background:repeating-linear-gradient(45deg,var(--rojo) 0 14px,#fff 14px 28px);
  }
  h1 { font-size:1.15rem; font-weight:600; color:#555; margin:6px 0 4px; }
  .quien { font-size:1.9rem; font-weight:800; color:var(--verde); margin:0 0 22px; word-break:break-word; }
  .regalo { font-size:5.5rem; cursor:pointer; user-select:none; display:inline-block;
            animation:latido 1.6s ease-in-out infinite; }
  @keyframes latido { 0%,100%{transform:scale(1) rotate(0)} 50%{transform:scale(1.08) rotate(-4deg)} }
  .regalo.abierto { animation:abrir .5s ease forwards; }
  @keyframes abrir { to { transform:scale(1.4) rotate(12deg); opacity:0; } }
  button {
    margin-top:18px; border:0; border-radius:999px; padding:14px 28px; font-size:1.05rem;
    font-weight:700; color:#fff; background:var(--rojo); cursor:pointer;
    box-shadow:0 6px 16px rgba(198,38,51,.35);
  }
  .oculto { display:none; }
  .resultado .etiqueta { color:#555; margin:0 0 6px; }
  .resultado .nombre {
    font-size:2.6rem; font-weight:900; color:var(--rojo); margin:0 0 14px; word-break:break-word;
    animation:aparecer .6s cubic-bezier(.2,1.4,.4,1) both;
  }
  @keyframes aparecer { from { transform:scale(.3); opacity:0; } }
  .nota { font-size:.9rem; color:#777; margin-top:16px; }
  .error .nombre { font-size:1.4rem; }
  .copo { position:fixed; top:-20px; color:#fff; opacity:.8; pointer-events:none; z-index:0;
          animation:caer linear infinite; }
  @keyframes caer { to { transform:translateY(110vh) rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <div id="sobre">
      <h1>Hola</h1>
      <p class="quien" id="quien">…</p>
      <div class="regalo" id="regalo" role="button" aria-label="Abrir regalo">🎁</div>
      <br>
      <button id="abrir">Ver a quién le regalo</button>
      <p class="nota">Asegurate de que nadie esté mirando 👀</p>
    </div>

    <div id="resultado" class="resultado oculto">
      <p class="etiqueta">Le regalás a…</p>
      <p class="nombre" id="receptor"></p>
      <p style="font-size:2.4rem;margin:0">🎄✨</p>
      <p class="nota">¡Guardá el secreto! 🤫</p>
    </div>

    <div id="error" class="error oculto">
      <p style="font-size:3rem;margin:0">😕</p>
      <p class="nombre">Este link no es válido</p>
      <p class="nota">Pedile al organizador que te lo vuelva a mandar completo.</p>
    </div>
  </div>

<script>
  const CLAVE = new TextEncoder().encode("amigo-invisible");

  function decodificar(codigo) {
    let b64 = codigo.replace(/-/g, "+").replace(/_/g, "/");
    b64 += "=".repeat((4 - b64.length % 4) % 4);
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i) ^ CLAVE[i % CLAVE.length];
    const d = JSON.parse(new TextDecoder("utf-8").decode(bytes));
    if (typeof d.d !== "string" || typeof d.r !== "string") throw new Error("formato");
    return d;
  }

  const $ = id => document.getElementById(id);
  let datos = null;
  try {
    datos = decodificar(decodeURIComponent(location.hash.slice(1)));
    $("quien").textContent = datos.d + " 👋";
    document.title = "Amigo Invisible de " + datos.d;
  } catch (e) {
    $("sobre").classList.add("oculto");
    $("error").classList.remove("oculto");
  }

  function revelar() {
    if (!datos) return;
    $("regalo").classList.add("abierto");
    setTimeout(() => {
      $("sobre").classList.add("oculto");
      $("receptor").textContent = datos.r;
      $("resultado").classList.remove("oculto");
    }, 450);
  }
  $("abrir").addEventListener("click", revelar);
  $("regalo").addEventListener("click", revelar);

  // Nieve
  for (let i = 0; i < 28; i++) {
    const c = document.createElement("div");
    c.className = "copo";
    c.textContent = "❄";
    c.style.left = Math.random() * 100 + "vw";
    c.style.fontSize = 8 + Math.random() * 14 + "px";
    c.style.animationDuration = 6 + Math.random() * 8 + "s";
    c.style.animationDelay = -Math.random() * 12 + "s";
    document.body.appendChild(c);
  }
</script>
</body>
</html>
